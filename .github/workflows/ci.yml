name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:web
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:web
      - run: npm audit --omit=dev --audit-level=high

  packaged-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run icon
      - if: runner.os == 'Windows'
        run: npx electron-builder --win --dir --publish never
      - if: runner.os == 'Linux'
        run: npx electron-builder --linux --dir --publish never
      - if: runner.os == 'macOS'
        run: npx electron-builder --mac --dir --publish never
      - if: runner.os == 'Windows'
        run: '& "release/win-unpacked/Rewind Overlay.exe" --smoke-test'
      - if: runner.os == 'Linux'
        run: xvfb-run -a release/linux-unpacked/rewind-overlay --smoke-test
      - if: runner.os == 'macOS'
        run: |
          APP_PATH="$(find release -path '*/Rewind Overlay.app/Contents/MacOS/Rewind Overlay' -type f -print -quit)"
          test -n "$APP_PATH"
          "$APP_PATH" --smoke-test
